name: CI/CD
on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - master

permissions:
  contents: read # for checkout

jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Enable Corepack
        run: corepack enable
      - name: (PACKAGE) Install dependencies
        run: pnpm install --frozen-lockfile
      - name: (PACKAGE) Build package
        run: pnpm build
      - name: (EXAMPLE) Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: examples/basic
      - name: (EXAMPLE) Run tests
        run: pnpm e2e:headless
        working-directory: examples/basic
  Release:
    name: Release
    needs: Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' # only release on pushes to master
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0.
          node-version: '24'
      - name: Install npm CLI for trusted publishing
        # npm >= 11.5.1 exchanges the OIDC token. dist-tag over OIDC needs >= 11.21.0.
        # Do not set registry-url here: setup-node would write an .npmrc that
        # conflicts with semantic-release authentication.
        run: npm install -g npm@11.21.2
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # pnpm leaves devDependencies of dependencies uninstalled. npm audit
      # signatures still parses those specs, and an alias such as
      # "source-map": "npm:source-map-js@latest" is resolved against a
      # different package already on disk (source-map@0.6.1).
      - name: Drop uninstalled npm alias devDependencies
        run: node scripts/strip-uninstalled-alias-dev-dependencies.mjs
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      # Publishes with the GitHub Actions OIDC identity. Do not pass NPM_TOKEN:
      # @semantic-release/npm uses a token when one is set and skips trusted publishing.
      # Before the first release from this workflow, add a trusted publisher at
      # https://www.npmjs.com/package/next-roots/access
      #   Organization or user: svobik7
      #   Repository: next-roots
      #   Workflow filename: ci-cd.yml
      #   Environment name: leave empty
      #   Allowed actions: npm publish and npm dist-tag
      # Publishers created after 3 Sep 2026 allow only `npm stage publish` until
      # those actions are selected. semantic-release calls `npm publish` and,
      # on maintenance branches, `npm dist-tag`. The first publish must succeed
      # within 2 days of creating the publisher, or the configuration expires.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: HUSKY=0 npx semantic-release
